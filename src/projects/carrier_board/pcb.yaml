assembly_test:
  test_fixture: flying_probe
  pass_criteria: all_steps_within_tolerance
  instructions:
  - step_id: TEST_CONTINUITY_GND
    description: Verify solid low-impedance ground plane continuity across all copper
      layers
    test_type: continuity
    net_or_points:
    - GND
    - IN1_GND
    - IN3_PWR
    expected_nominal: 0.05
    tolerance_pct: 20.0
    unit: ohm
  - step_id: TEST_UART_BLE_SPEED
    description: Measure BTLE high-speed 1Mb/s UART signal integrity on BLE_TX / BLE_RX
    test_type: voltage
    net_or_points:
    - BLE_TX
    - BLE_RX
    expected_nominal: 3.30
    tolerance_pct: 3.0
    unit: V
    stimulus: 1Mb/s PRBS UART serial test
  - step_id: TEST_CAP_SENSE_CHAN0
    description: Measure baseline mutual capacitance on liquid level electrode Channel
      0
    test_type: capacitance
    net_or_points:
    - CAP_TX0
    - CAP_RX0
    expected_nominal: 12.5
    tolerance_pct: 15.0
    unit: pF
    stimulus: 250kHz 1.8V square
  - step_id: TEST_CAP_SENSE_CHAN1
    description: Measure baseline mutual capacitance on liquid level electrode Channel
      1
    test_type: capacitance
    net_or_points:
    - CAP_TX1
    - CAP_RX1
    expected_nominal: 14.0
    tolerance_pct: 15.0
    unit: pF
    stimulus: 250kHz 1.8V square
  - step_id: TEST_CAP_SENSE_CHAN2
    description: Measure baseline mutual capacitance on liquid level electrode Channel
      2
    test_type: capacitance
    net_or_points:
    - CAP_TX2
    - CAP_RX2
    expected_nominal: 15.5
    tolerance_pct: 15.0
    unit: pF
    stimulus: 250kHz 1.8V square
  - step_id: TEST_CAP_SENSE_CHAN3
    description: Measure baseline self capacitance on liquid proximity electrode Channel
      3
    test_type: capacitance
    net_or_points:
    - CAP_RX3
    expected_nominal: 8.0
    tolerance_pct: 15.0
    unit: pF
    stimulus: 250kHz 1.8V square
