# PCB Materials Library
# Physical and electrical parameters for multi-layer rigid, flexible, and RF PCB stackups.

material:
  # FR4 Rigid Dielectric Core (e.g. Isola 370HR / Shengyi S1000-2)
  fr4_core:
    density: 1.85
    boundary_friction: 0.25
    contact_angle: 70.0
    roughness: 0.40
    ior: 1.54
    transmission: 0.0
    metallic: 0.0
    specular: 0.30
    dielectric_constant: 4.4
    loss_tangent: 0.018
    breakdown_voltage_v_per_mm: 30000.0
    layer_type: dielectric

  # FR4 2116 Prepreg Bonding Layer
  fr4_prepreg_2116:
    density: 1.80
    boundary_friction: 0.25
    contact_angle: 70.0
    roughness: 0.40
    ior: 1.54
    transmission: 0.0
    metallic: 0.0
    specular: 0.30
    dielectric_constant: 4.2
    loss_tangent: 0.016
    breakdown_voltage_v_per_mm: 32000.0
    layer_type: dielectric

  # Polyimide Flexible Substrate (DuPont Pyralux AP / Kapton)
  polyimide_flex:
    density: 1.42
    boundary_friction: 0.20
    contact_angle: 65.0
    roughness: 0.25
    ior: 1.68
    transmission: 0.20
    metallic: 0.0
    specular: 0.40
    dielectric_constant: 3.4
    loss_tangent: 0.002
    breakdown_voltage_v_per_mm: 120000.0
    layer_type: dielectric

  # Standard Copper Foil (35 µm / 1 oz)
  copper:
    density: 8.96
    boundary_friction: 0.15
    contact_angle: 60.0
    roughness: 0.20
    ior: 0.25
    transmission: 0.0
    metallic: 0.95
    specular: 0.85
    sheet_resistance_mohm_sq: 0.49
    conductivity_ms_m: 58.0
    layer_type: signal

  # 1 oz/ft² Electrodeposited Copper Foil (35 µm)
  copper_1oz:
    density: 8.96
    boundary_friction: 0.15
    contact_angle: 60.0
    roughness: 0.20
    ior: 0.25
    transmission: 0.0
    metallic: 0.95
    specular: 0.85
    sheet_resistance_mohm_sq: 0.49
    conductivity_ms_m: 58.0
    layer_type: signal

  # 2 oz/ft² Heavy Copper Foil (70 µm)
  copper_2oz:
    density: 8.96
    boundary_friction: 0.15
    contact_angle: 60.0
    roughness: 0.20
    ior: 0.25
    transmission: 0.0
    metallic: 0.95
    specular: 0.85
    sheet_resistance_mohm_sq: 0.25
    conductivity_ms_m: 58.0

  # Solder Mask (Matte Black)
  matte_black_mask:
    density: 1.30
    boundary_friction: 0.30
    contact_angle: 70.0
    roughness: 0.50
    ior: 1.50
    transmission: 0.0
    metallic: 0.0
    specular: 0.20
    dielectric_constant: 3.8

  # Surface Finish: Electroless Nickel Immersion Gold (ENIG)
  enig_finish:
    density: 19.3
    boundary_friction: 0.12
    contact_angle: 60.0
    roughness: 0.15
    ior: 0.20
    transmission: 0.0
    metallic: 1.0
    specular: 0.95

  # Surface Finish: Hot Air Solder Leveling (HASL)
  hasl_finish:
    density: 7.31
    boundary_friction: 0.18
    contact_angle: 65.0
    roughness: 0.30
    ior: 0.30
    transmission: 0.0
    metallic: 0.90
    specular: 0.80
