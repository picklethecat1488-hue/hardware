name: SensorHub_Carrier
board_type: rigid-flex
dimensions_mm: [60.0, 90.0, 1.6]
shape_ref: carrier_board

stackup:
  finish: ENIG
  soldermask_color: matte_black
  silkscreen_color: white
  layers:
    - name: F.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: Prepreg1
      layer_type: dielectric
      thickness_mm: 0.100
      material: fr4_prepreg_2116
      dielectric_constant: 4.1
      loss_tangent: 0.018
    - name: In1.Cu
      layer_type: ground
      thickness_mm: 0.035
      material: copper
    - name: Core1
      layer_type: dielectric
      thickness_mm: 0.450
      material: fr4_core
      dielectric_constant: 4.3
      loss_tangent: 0.020
    - name: In2.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: FlexDielectric
      layer_type: dielectric
      thickness_mm: 0.200
      material: polyimide_flex
      dielectric_constant: 3.4
      loss_tangent: 0.005
    - name: In3.Cu
      layer_type: power
      thickness_mm: 0.035
      material: copper
    - name: Core2
      layer_type: dielectric
      thickness_mm: 0.450
      material: fr4_core
      dielectric_constant: 4.3
      loss_tangent: 0.020
    - name: In4.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: Prepreg2
      layer_type: dielectric
      thickness_mm: 0.100
      material: fr4_prepreg_2116
      dielectric_constant: 4.1
      loss_tangent: 0.018
    - name: B.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper

net_classes:
  - name: PCIE_GEN4
    trace_width_mm: 0.14
    clearance_mm: 0.16
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: pcie
    require_ground_stitch_via: true
    max_stitch_via_distance_mm: 1.0
    diff_pairs:
      - name: PCIE_L0_TX
        pos_net: PCIE_TX0_P
        neg_net: PCIE_TX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2
      - name: PCIE_L0_RX
        pos_net: PCIE_RX0_P
        neg_net: PCIE_RX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2

  - name: MIPI_DISPLAY
    trace_width_mm: 0.12
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: display
    diff_pairs:
      - name: MIPI_D0
        pos_net: MIPI_DATA0_P
        neg_net: MIPI_DATA0_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2
      - name: MIPI_CLK
        pos_net: MIPI_CLK_P
        neg_net: MIPI_CLK_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2

  - name: RF_2GHZ
    trace_width_mm: 0.16
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: rf
    coplanar_waveguide: true
    ground_gap_mm: 0.20
    keepout_clearance_mm: 1.5
    single_nets:
      - RF_ANT_FEED

flex_zones:
  - name: flex_tail_ribbon
    start_x_mm: 30.0
    length_mm: 50.0
    substrate_thickness_mm: 0.050
    coverlay_thickness_mm: 0.025
    min_bend_radius_mm: 3.0
    shape_ref: flex_tail

capacitive_sensors:
  - name: SENSE_WATER_LEVEL_LOW
    channel_id: 0
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 18.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX0
    rx_pin: CAP_RX0
    threshold_raw: 2200
    shape_ref: flex_tail

  - name: SENSE_WATER_LEVEL_HIGH
    channel_id: 1
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 18.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX1
    rx_pin: CAP_RX1
    threshold_raw: 2800
    shape_ref: flex_tail
