# Print Materials Configuration
#
# Density is defined in grams per cubic centimeter (g/cm³).
# In build123d, geometry calculations are in millimeters (mm), so volumes are in mm³.
# To calculate actual mass in grams from a build123d volume:
#   mass (g) = volume (mm³) * density (g/cm³) * 1e-3
#
# These material properties are used for:
# 1. Total mass calculations of printed parts.
# 2. Centroid/center of mass calculation.
# 3. 3x3 inertia tensor calculations (e.g. for physics simulation or load calculations).

material:
  # Polylactic Acid (PLA)
  # A biodegradable thermoplastic polyester derived from renewable resources like corn starch.
  # Easy to print, stiff, but has low temperature resistance.
  pla:
    density: 1.24
    boundary_friction: 0.30
    contact_angle: 68.0
    roughness: 0.30
    ior: 1.49
    transmission: 0.0
    metallic: 0.0
    specular: 0.50

  # Polyethylene Terephthalate Glycol-modified (PETG)
  # A thermoplastic polyester that provides significant chemical resistance, durability,
  # and formability for manufacturing. Sturdier than PLA and more heat-resistant.
  petg:
    density: 1.27
    boundary_friction: 0.20
    contact_angle: 75.0
    roughness: 0.28
    ior: 1.57
    transmission: 0.0
    metallic: 0.0
    specular: 0.50

  # Acrylonitrile Butadiene Styrene (ABS)
  # An impact-resistant engineering plastic. Strong, tough, and heat-resistant,
  # but prone to warping during printing and requires a heated enclosure.
  abs:
    density: 1.04
    boundary_friction: 0.25
    contact_angle: 80.0
    roughness: 0.35
    ior: 1.50
    transmission: 0.0
    metallic: 0.0
    specular: 0.50

  # Thermoplastic Polyurethane (TPU)
  # A flexible, elastic copolymer with high abrasion resistance, rubber-like elasticity,
  # and excellent layer adhesion. Perfect for flexible push-fit seals and covers.
  tpu:
    density: 1.20
    boundary_friction: 0.50
    contact_angle: 85.0
    roughness: 0.45
    ior: 1.45
    transmission: 0.0
    metallic: 0.0
    specular: 0.30

  # Aluminum
  aluminum:
    density: 2.70
    boundary_friction: 0.15
    contact_angle: 70.0
    roughness: 0.35
    ior: 1.50
    transmission: 0.0
    metallic: 0.85
    specular: 0.50

  # UTR-8100 Translucent Resin (SLA)
  utr8100:
    density: 1.15
    boundary_friction: 0.22
    contact_angle: 72.0
    roughness: 0.20
    ior: 1.51
    transmission: 0.85
    metallic: 0.0
    specular: 0.50


  # Water (Liquid)
  water:
    density: 1.00
    boundary_friction: 0.0
    contact_angle: 0.0
    roughness: 0.08
    ior: 1.333
    transmission: 0.95
    metallic: 0.0
    specular: 0.30
    fluid_voxel_size: 0.0003
    fluid_point_radius: 0.0034
    fluid_surface_threshold: 0.12
    fluid_adaptivity: 0.0
    fluid_smooth_iterations: 4
    fluid_smooth_factor: 0.60
    use_ssfr: false

  # Generic Metal
  metal:
    density: 7.85
    boundary_friction: 0.20
    contact_angle: 70.0
    roughness: 0.35
    ior: 1.50
    transmission: 0.0
    metallic: 0.85
    specular: 0.50

  # Generic Plastic
  plastic:
    density: 1.15
    boundary_friction: 0.30
    contact_angle: 75.0
    roughness: 0.30
    ior: 1.49
    transmission: 0.0
    metallic: 0.0
    specular: 0.50

  # PCB Materials
  # FR4 Rigid Dielectric Core
  fr4_core:
    density: 1.85
    boundary_friction: 0.25
    contact_angle: 70.0
    roughness: 0.40
    ior: 1.54
    transmission: 0.0
    metallic: 0.0
    specular: 0.30
    dielectric_constant: 4.4
    loss_tangent: 0.018
    breakdown_voltage_v_per_mm: 30000.0

  # FR4 2116 Prepreg Bonding Layer
  fr4_prepreg_2116:
    density: 1.80
    boundary_friction: 0.25
    contact_angle: 70.0
    roughness: 0.40
    ior: 1.54
    transmission: 0.0
    metallic: 0.0
    specular: 0.30
    dielectric_constant: 4.2
    loss_tangent: 0.016
    breakdown_voltage_v_per_mm: 32000.0

  # Polyimide Flexible Substrate
  polyimide_flex:
    density: 1.42
    boundary_friction: 0.20
    contact_angle: 65.0
    roughness: 0.25
    ior: 1.68
    transmission: 0.20
    metallic: 0.0
    specular: 0.40
    dielectric_constant: 3.4
    loss_tangent: 0.002
    breakdown_voltage_v_per_mm: 120000.0

  # 1 oz/ft² Electrodeposited Copper Foil (35 µm)
  copper_1oz:
    density: 8.96
    boundary_friction: 0.15
    contact_angle: 60.0
    roughness: 0.20
    ior: 0.25
    transmission: 0.0
    metallic: 0.95
    specular: 0.85
    sheet_resistance_mohm_sq: 0.49
    conductivity_ms_m: 58.0

  # 2 oz/ft² Heavy Copper Foil (70 µm)
  copper_2oz:
    density: 8.96
    boundary_friction: 0.15
    contact_angle: 60.0
    roughness: 0.20
    ior: 0.25
    transmission: 0.0
    metallic: 0.95
    specular: 0.85
    sheet_resistance_mohm_sq: 0.25
    conductivity_ms_m: 58.0

  # Solder Mask (Matte Black)
  matte_black_mask:
    density: 1.30
    boundary_friction: 0.30
    contact_angle: 70.0
    roughness: 0.50
    ior: 1.50
    transmission: 0.0
    metallic: 0.0
    specular: 0.20
    dielectric_constant: 3.8

  # Surface Finish: Electroless Nickel Immersion Gold (ENIG)
  enig_finish:
    density: 19.3
    boundary_friction: 0.12
    contact_angle: 60.0
    roughness: 0.15
    ior: 0.20
    transmission: 0.0
    metallic: 1.0
    specular: 0.95

  # Surface Finish: Hot Air Solder Leveling (HASL)
  hasl_finish:
    density: 7.31
    boundary_friction: 0.18
    contact_angle: 65.0
    roughness: 0.30
    ior: 0.30
    transmission: 0.0
    metallic: 0.90
    specular: 0.80



