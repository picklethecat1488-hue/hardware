# Declarative 3D Component Layout & Netlist Configuration
components:
  - name: battery
    package: battery
    position: [0.0, -40.0, 25.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [25.0, 35.0, 6.0]
    label:
      text: "LiPo Battery"
      position: [0.0, -20.0, 0.0]
      align: [center, max]
    pins:
      - name: "+"
        label: "+"
        side: right
      - name: "-"
        label: "-"
        side: right

  - name: charger
    package: board
    position: [0.0, -79.0, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [18.0, 29.0, 1.6]
    mounting_holes: [13.97, 25.15]
    label:
      text: "BQ25185"
      position: [0.0, -17.5, 0.0]
      align: [center, max]
    pins:
      - name: "BAT+"
        label: "BAT+"
        side: right
      - name: "BAT-"
        label: "BAT-"
        side: right
      - name: "S1"
        label: "S1"
        side: right
      - name: "SYS"
        label: "SYS"
        side: left
      - name: "GND"
        label: "GND"
        side: left
      - name: "S2"
        label: "S2"
        side: left

  - name: pico
    package: board
    position: [-50.0, 0.0, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [17.0, 52.0, 1.6]
    mounting_holes: [11.4, 47.0]
    slots_per_side: 20
    label:
      text: "PICO W"
      position: [0.0, 29.0, 0.0]
      align: [center, min]
    pins:
      - name: "GP2"
        label: "GP2"
        side: right
        slot: 3
      - name: "GP3"
        label: "GP3"
        side: right
        slot: 4
      - name: "GP4"
        label: "GP4 (CTRL_XSHUT_N)"
        side: right
        slot: 5
      - name: "GP5"
        label: "GP5 (CTRL_XSHUT_E)"
        side: right
        slot: 6
      - name: "GP6"
        label: "GP6 (CTRL_XSHUT_W)"
        side: right
        slot: 8
      - name: "GP7"
        label: "GP7 (CTRL_INT_N)"
        side: right
        slot: 9
      - name: "GP8"
        label: "GP8"
        side: right
        slot: 10
      - name: "GP9"
        label: "GP9 (CTRL_INT_E)"
        side: right
        slot: 11
      - name: "GP10"
        label: "GP10 (CTRL_INT_W)"
        side: right
        slot: 13
      - name: "GP11"
        label: "GP11 (LED_DATA)"
        side: right
        slot: 12
      - name: "GP12"
        label: "GP12 (I2C_SDA)"
        side: right
        slot: 15
      - name: "GP13"
        label: "GP13 (I2C_SCL)"
        side: right
        slot: 16
      - name: "GP14"
        label: "GP14 (CTRL_ALRT)"
        side: right
        slot: 18
      - name: "GP15"
        label: "GP15"
        side: right
        slot: 19
      - name: "GP18"
        label: "GP18 (CTRL_EN)"
        side: left
        slot: 3
      - name: "GP19"
        label: "GP19 (CTRL_IN1)"
        side: left
        slot: 4
      - name: "GP20"
        label: "GP20 (CTRL_IN2)"
        side: left
        slot: 5
      - name: "GP21"
        label: "GP21 (CTRL_IN3)"
        side: left
        slot: 6
      - name: "GP22"
        label: "GP22 (CTRL_DIAG)"
        side: left
        slot: 7
      - name: "GND_L"
        label: "3 (GND)"
        side: right
        slot: 2
      - name: "VSYS"
        label: "39 (VSYS)"
        side: left
        slot: 18
      - name: "GND_R"
        label: "38 (GND)"
        side: left
        slot: 17
      - name: "3V3"
        label: "36 (3V3)"
        side: left
        slot: 15
      - name: "GP26"
        label: "GP26 (SPEED_SENSE)"
        side: left
        slot: 11

  - name: fuel_gauge
    package: board
    position: [50.0, -45.0, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [24.0, 20.0, 1.6]
    mounting_holes: [20.32, 12.7]
    label:
      text: "MAX17048"
      position: [0.0, -13.0, 0.0]
      align: [center, max]
    pins:
      - name: "BAT"
        label: "BAT"
        side: right
      - name: "VIN"
        label: "VIN"
        side: right
      - name: "GND"
        label: "GND"
        side: right
      - name: "SDA"
        label: "SDA"
        side: right
      - name: "SCL"
        label: "SCL"
        side: right
      - name: "ALRT"
        label: "ALRT"
        side: left

  - name: current_monitor
    package: board
    position: [50.0, -15.0, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [25.0, 21.5, 1.6]
    mounting_holes: [20.32, 12.7]
    label:
      text: "INA219"
      position: [15.5, 0.0, 0.0]
      align: [min, center]
    pins:
      - name: "VCC"
        label: "VCC"
        side: right
      - name: "GND"
        label: "GND"
        side: right
      - name: "SDA"
        label: "SDA"
        side: right
      - name: "SCL"
        label: "SCL"
        side: right
      - name: "VIN+"
        label: "VIN+"
        side: left
      - name: "VIN-"
        label: "VIN-"
        side: left

  - name: motor_driver
    package: board
    position: [50.0, 15.0, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [25.4, 20.3, 1.6]
    mounting_holes: [22.86, 17.78]
    label:
      text: "TMC6300"
      position: [15.0, 0.0, 0.0]
      align: [min, center]
    pins:
      - name: "VCC"
        label: "VCC"
        side: right
      - name: "VIO"
        label: "VIO"
        side: right
      - name: "GND"
        label: "GND"
        side: right
      - name: "IN1"
        label: "IN1"
        side: right
      - name: "IN2"
        label: "IN2"
        side: right
      - name: "IN3"
        label: "IN3"
        side: right
      - name: "EN"
        label: "EN"
        side: right
      - name: "DIAG"
        label: "DIAG"
        side: right
      - name: "OUT1"
        label: "OUT1"
        side: left
      - name: "OUT2"
        label: "OUT2"
        side: left
      - name: "OUT3"
        label: "OUT3"
        side: left

  - name: motor
    package: motor
    position: [0.0, 0.0, 28.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [13.8, 13.8, 9.3]
    label:
      text: "1102 BLDC"
      position: [0.0, -8.0, 0.0]
      align: [center, max]
    pins:
      - name: "U"
        label: "U"
        side: top
      - name: "V"
        label: "V"
        side: top
      - name: "W"
        label: "W"
        side: top

  - name: sensor_east
    package: tof_sensor
    joint_ref:
      joint: sensor_port_east
      offset: [-18.3, 0.0, 0.0]
    dimensions: [17.0, 25.0, 2.0]
    label:
      text: "VL53L0X (EAST)"
      position: [10.0, 0.0, 0.0]
      align: [min, center]
    pins:
      - name: "VCC"
        label: "VCC"
        side: right
      - name: "GND"
        label: "GND"
        side: right
      - name: "SDA"
        label: "SDA"
        side: right
      - name: "SCL"
        label: "SCL"
        side: right
      - name: "XSHUT"
        label: "XSHUT"
        side: left
      - name: "INT"
        label: "INT"
        side: left

  - name: sensor_north
    package: tof_sensor
    joint_ref:
      joint: sensor_port_north
      offset: [-18.3, 0.0, 0.0]
    dimensions: [25.0, 17.0, 2.0]
    label:
      text: "VL53L0X (NORTH)"
      position: [0.0, 10.0, 0.0]
      align: [center, min]
    pins:
      - name: "VCC"
        label: "VCC"
        side: top
      - name: "GND"
        label: "GND"
        side: top
      - name: "SDA"
        label: "SDA"
        side: top
      - name: "SCL"
        label: "SCL"
        side: top
      - name: "XSHUT"
        label: "XSHUT"
        side: bottom
      - name: "INT"
        label: "INT"
        side: bottom

  - name: sensor_west
    package: tof_sensor
    joint_ref:
      joint: sensor_port_west
      offset: [-18.3, 0.0, 0.0]
    dimensions: [17.0, 25.0, 2.0]
    label:
      text: "VL53L0X (WEST)"
      position: [-10.0, 0.0, 0.0]
      align: [max, center]
    pins:
      - name: "VCC"
        label: "VCC"
        side: left
      - name: "GND"
        label: "GND"
        side: left
      - name: "SDA"
        label: "SDA"
        side: left
      - name: "SCL"
        label: "SCL"
        side: left
      - name: "XSHUT"
        label: "XSHUT"
        side: right
      - name: "INT"
        label: "INT"
        side: right

  - name: led
    package: led
    joint_ref:
      joint: led_port
      offset: [0.0, 0.0, 0.0]
    dimensions: [10.0, 10.0, 1.0]
    label:
      text: "RGB LED"
      position: [0.0, 6.0, 0.0]
      align: [center, min]
    pins:
      - name: "VCC"
        label: "VCC"
        side: right
      - name: "GND"
        label: "GND"
        side: right
      - name: "DIN"
        label: "DIN"
        side: left

  - name: speed_sensor
    package: TO-92
    position: [0.0, -17.5, 23.0]
    rotation: [0.0, 0.0, 0.0]
    dimensions: [4.5, 2.2, 4.5]
    label:
      text: "Hall Speed Sensor"
      position: [0.0, -10.0, 0.0]
      align: [center, max]
    pins:
      - name: "VCC"
        label: "VCC"
        side: left
      - name: "GND"
        label: "GND"
        side: left
      - name: "OUT"
        label: "OUT"
        side: right

nets:
  - name: gnd
    color: black
    pins:
      - [battery, "-"]
      - [charger, GND]
      - [charger, BAT-]
      - [fuel_gauge, GND]
      - [sensor_east, GND]
      - [current_monitor, GND]
      - [motor_driver, GND]
      - [led, GND]
      - [sensor_north, GND]
      - [sensor_west, GND]
      - [pico, GND_R]
      - [speed_sensor, GND]

  - name: vcc_logic
    color: red
    pins:
      - [pico, 3V3]
      - [sensor_west, VCC]
      - [sensor_north, VCC]
      - [led, VCC]
      - [sensor_east, VCC]
      - [fuel_gauge, VIN]
      - [motor_driver, VIO]
      - [speed_sensor, VCC]

  - name: vcc_bat
    color: red
    pins:
      - [battery, "+"]
      - [charger, BAT+]
      - [fuel_gauge, BAT]

  - name: vcc_sys_pico
    color: red
    pins:
      - [charger, SYS]
      - [pico, VSYS]

  - name: vcc_sys_cm
    color: red
    pins:
      - [charger, SYS]
      - [current_monitor, VIN+]

  - name: cm_jumper
    color: red
    pins:
      - [current_monitor, VCC]
      - [current_monitor, VIN+]

  - name: vcc_sys_md
    color: red
    pins:
      - [current_monitor, VIN-]
      - [motor_driver, VCC]

  - name: sda
    color: yellow
    pins:
      - [pico, GP12]
      - [sensor_west, SDA]
      - [sensor_north, SDA]
      - [current_monitor, SDA]
      - [sensor_east, SDA]
      - [fuel_gauge, SDA]

  - name: scl
    color: blue
    offset: [1.5, 1.5]
    pins:
      - [pico, GP13]
      - [sensor_west, SCL]
      - [sensor_north, SCL]
      - [current_monitor, SCL]
      - [sensor_east, SCL]
      - [fuel_gauge, SCL]

  - name: motor_u
    color: purple
    pins:
      - [motor_driver, OUT1]
      - [motor, U]

  - name: motor_v
    color: green
    pins:
      - [motor_driver, OUT2]
      - [motor, V]

  - name: motor_w
    color: blue
    pins:
      - [motor_driver, OUT3]
      - [motor, W]

  - name: led_data
    color: purple
    pins:
      - [pico, GP11]
      - [led, DIN]

  - name: ctrl_xshut_n
    color: orange
    pins:
      - [pico, GP4]
      - [sensor_north, XSHUT]

  - name: ctrl_xshut_e
    color: orange
    pins:
      - [pico, GP5]
      - [sensor_east, XSHUT]

  - name: ctrl_xshut_w
    color: orange
    pins:
      - [pico, GP6]
      - [sensor_west, XSHUT]

  - name: ctrl_int_n
    color: green
    pins:
      - [pico, GP7]
      - [sensor_north, INT]

  - name: ctrl_int_e
    color: green
    pins:
      - [pico, GP9]
      - [sensor_east, INT]

  - name: ctrl_int_w
    color: green
    pins:
      - [pico, GP10]
      - [sensor_west, INT]

  - name: ctrl_alrt
    color: orange
    pins:
      - [pico, GP14]
      - [fuel_gauge, ALRT]

  - name: ctrl_in1
    color: cyan
    pins:
      - [pico, GP19]
      - [motor_driver, IN1]

  - name: ctrl_in2
    color: magenta
    pins:
      - [pico, GP20]
      - [motor_driver, IN2]

  - name: ctrl_in3
    color: yellow
    pins:
      - [pico, GP21]
      - [motor_driver, IN3]

  - name: ctrl_en
    color: orange
    pins:
      - [pico, GP18]
      - [motor_driver, EN]

  - name: ctrl_diag
    color: blue
    pins:
      - [pico, GP22]
      - [motor_driver, DIAG]

  - name: speed_sense
    color: green
    pins:
      - [pico, GP26]
      - [speed_sensor, OUT]
