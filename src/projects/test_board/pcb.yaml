name: TestBoard_Carrier
board_type: rigid-flex
revision: "1.0"
shape_ref: carrier_board
sheet_size: A4

net_classes:
  - name: PCIE_GEN4
    trace_width_mm: 0.14
    clearance_mm: 0.16
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: pcie
    require_ground_stitch_via: true
    max_stitch_via_distance_mm: 1.0
    diff_pairs:
      - name: PCIE_L0_TX
        pos_net: PCIE_TX0_P
        neg_net: PCIE_TX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2
      - name: PCIE_L0_RX
        pos_net: PCIE_RX0_P
        neg_net: PCIE_RX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2

  - name: MIPI_DISPLAY
    trace_width_mm: 0.12
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: display
    diff_pairs:
      - name: MIPI_D0
        pos_net: MIPI_DATA0_P
        neg_net: MIPI_DATA0_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2
      - name: MIPI_CLK
        pos_net: MIPI_CLK_P
        neg_net: MIPI_CLK_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2

  - name: RF_2GHZ
    trace_width_mm: 0.13
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: rf
    coplanar_waveguide: true
    ground_gap_mm: 0.22
    keepout_clearance_mm: 1.5
    single_nets:
      - RF_ANT_FEED

  - name: I2C_BUS
    trace_width_mm: 0.15
    clearance_mm: 0.15
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: digital
    single_nets:
      - I2C_SDA
      - I2C_SCL

  - name: PWR_3V3
    trace_width_mm: 0.35
    clearance_mm: 0.20
    via_dia_mm: 0.50
    via_drill_mm: 0.25
    interface_type: power
    single_nets:
      - 3V3

flex_zones:
  - name: flex_tail_ribbon
    start_x_mm: 30.0
    length_mm: 50.0
    substrate_thickness_mm: 0.050
    coverlay_thickness_mm: 0.025
    min_bend_radius_mm: 3.0
    shape_ref: flex_tail

capacitive_sensors:
  - name: SENSE_WATER_LEVEL_LOW
    channel_id: 0
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    center_mm: [0.0, -12.0]
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX0
    rx_pin: CAP_RX0
    threshold_raw: 2200
    shape_ref: flex_tail

  - name: SENSE_WATER_LEVEL_MID
    channel_id: 1
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    center_mm: [0.0, -0.5]
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX1
    rx_pin: CAP_RX1
    threshold_raw: 2500
    shape_ref: flex_tail

  - name: SENSE_WATER_LEVEL_HIGH
    channel_id: 2
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    center_mm: [0.0, 11.0]
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX2
    rx_pin: CAP_RX2
    threshold_raw: 2800
    shape_ref: flex_tail

  - name: SENSE_WATER_PROXIMITY
    channel_id: 3
    electrode_type: self
    shape: pad
    area_mm: [10.0, 6.0]
    center_mm: [0.0, 19.5]
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    rx_pin: CAP_RX3
    threshold_raw: 1500
    shape_ref: flex_tail

schematic_sheets:
  - title: Power Supply & Distribution
    description: USB-C connector, 3.3V LDO regulator, primary rails, and load switch MOSFET
    components: [J_USB, R_CC1, R_CC2, U3, C_IN, C_OUT, Q1, J1, C1, C2, C3]
    pin_breakouts:
      J_USB: [VBUS, GND, CC1, CC2, SHIELD1, SHIELD2]
      R_CC1: ["1", "2"]
      R_CC2: ["1", "2"]
      U3: ["1", "2", "3", "5"]
      C_IN: ["1", "2"]
      C_OUT: ["1", "2"]
      Q1: [G, S, D]
      J1: [GND, 3V3, VLOAD_SW]
      C1: ["1", "2"]
      C2: ["1", "2"]
      C3: ["1", "2"]

  - title: High-Speed I/O & Interfaces
    description: PCIe Gen4 x1 differential link and MIPI D-PHY display interface
    components: [J1, U1, J2]
    pin_breakouts:
      J1: [PETp0, PETn0, PERp0, PERn0]
      U1: [A1, A2, B1, B2, N14, P14, C1, C2]
      J2: [D0_P, D0_N, CLK_P, CLK_N]

  - title: Microcontroller Clock, Reset & Audio Subsystem
    description: 24MHz crystal oscillator, reset network, boot configuration, and MAX98357A PDM audio amplifier
    components: [U1, Y1, C_OSC1, C_OSC2, R_RST, C_RST, R_BOOT, C4, C5, U4, C_AMP, SPK1]
    pin_breakouts:
      U1: [H7, H8, D1, K1, K2, M1, M2, G1, G2, G3]
      Y1: ["1", "2", "3", "4"]
      C_OSC1: ["1", "2"]
      C_OSC2: ["1", "2"]
      R_RST: ["1", "2"]
      C_RST: ["1", "2"]
      R_BOOT: ["1", "2"]
      C4: ["1", "2"]
      C5: ["1", "2"]
      U4: [DIN, BCLK, LRCLK, GAIN, SD_MODE, GND, VDD, OUTP, OUTN]
      C_AMP: ["1", "2"]
      SPK1: ["1", "2"]

  - title: Capacitive Sensing & Control
    description: CY8CMBR3116 CapSense controller, 4-channel liquid level flex tail, and I2C bus
    components: [U1, U2, J2, R1, R2, C_VREG]
    pin_breakouts:
      U1: [F1, F2, D2]
      U2: [VDD, VSS, SDA, SCL, INT, CS0, CS1, CS2, CS3, CS4, CS5, CS6, SHIELD, VREG]
      J2: [CAP_TX0, CAP_RX0, CAP_TX1, CAP_RX1, CAP_TX2, CAP_RX2, CAP_RX3, CAP_SHIELD]
      R1: ["1", "2"]
      R2: ["1", "2"]
      C_VREG: ["1", "2"]

assembly_test:
  test_fixture: flying_probe
  pass_criteria: all_steps_within_tolerance
  instructions:
    - step_id: TEST_CONTINUITY_GND
      description: Verify solid low-impedance ground plane continuity across all copper layers
      test_type: continuity
      net_or_points: [GND, IN1_GND, IN3_PWR]
      expected_nominal: 0.05
      tolerance_pct: 20.0
      unit: ohm
    - step_id: TEST_IMP_PCIE_DIFF
      description: Measure PCIe Gen4 differential impedance on TX0+/TX0-
      test_type: impedance
      net_or_points: [PCIE_TX0_P, PCIE_TX0_N]
      expected_nominal: 85.0
      tolerance_pct: 10.0
      unit: ohm
      stimulus: 100ps TDR step
    - step_id: TEST_CAP_SENSE_CHAN0
      description: Measure baseline mutual capacitance on liquid level electrode Channel 0
      test_type: capacitance
      net_or_points: [CAP_TX0, CAP_RX0]
      expected_nominal: 12.5
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN1
      description: Measure baseline mutual capacitance on liquid level electrode Channel 1
      test_type: capacitance
      net_or_points: [CAP_TX1, CAP_RX1]
      expected_nominal: 14.0
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN2
      description: Measure baseline mutual capacitance on liquid level electrode Channel 2
      test_type: capacitance
      net_or_points: [CAP_TX2, CAP_RX2]
      expected_nominal: 15.5
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN3
      description: Measure baseline self capacitance on liquid proximity electrode Channel 3
      test_type: capacitance
      net_or_points: [CAP_RX3]
      expected_nominal: 8.0
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square

