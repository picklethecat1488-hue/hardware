name: TestBoard_Carrier
board_type: rigid-flex
revision: "1.0"
dimensions_mm: [60.0, 90.0, 1.6]
shape_ref: carrier_board
sheet_size: A4

stackup:
  finish: ENIG
  soldermask_color: matte_black
  silkscreen_color: white
  layers:
    - name: F.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: Prepreg1
      layer_type: dielectric
      thickness_mm: 0.100
      material: fr4_prepreg_2116
      dielectric_constant: 4.1
      loss_tangent: 0.018
    - name: In1.Cu
      layer_type: ground
      thickness_mm: 0.035
      material: copper
    - name: Core1
      layer_type: dielectric
      thickness_mm: 0.450
      material: fr4_core
      dielectric_constant: 4.3
      loss_tangent: 0.020
    - name: In2.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: FlexDielectric
      layer_type: dielectric
      thickness_mm: 0.200
      material: polyimide_flex
      dielectric_constant: 3.4
      loss_tangent: 0.005
    - name: In3.Cu
      layer_type: power
      thickness_mm: 0.035
      material: copper
    - name: Core2
      layer_type: dielectric
      thickness_mm: 0.450
      material: fr4_core
      dielectric_constant: 4.3
      loss_tangent: 0.020
    - name: In4.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper
    - name: Prepreg2
      layer_type: dielectric
      thickness_mm: 0.100
      material: fr4_prepreg_2116
      dielectric_constant: 4.1
      loss_tangent: 0.018
    - name: B.Cu
      layer_type: signal
      thickness_mm: 0.035
      material: copper

net_classes:
  - name: PCIE_GEN4
    trace_width_mm: 0.14
    clearance_mm: 0.16
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: pcie
    require_ground_stitch_via: true
    max_stitch_via_distance_mm: 1.0
    diff_pairs:
      - name: PCIE_L0_TX
        pos_net: PCIE_TX0_P
        neg_net: PCIE_TX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2
      - name: PCIE_L0_RX
        pos_net: PCIE_RX0_P
        neg_net: PCIE_RX0_N
        target_impedance_ohms: 85.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.10
        max_inter_pair_skew_mm: 0.50
        max_via_count: 2

  - name: MIPI_DISPLAY
    trace_width_mm: 0.12
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: display
    diff_pairs:
      - name: MIPI_D0
        pos_net: MIPI_DATA0_P
        neg_net: MIPI_DATA0_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2
      - name: MIPI_CLK
        pos_net: MIPI_CLK_P
        neg_net: MIPI_CLK_N
        target_impedance_ohms: 100.0
        impedance_tolerance_percent: 10.0
        max_intra_pair_skew_mm: 0.15
        max_inter_pair_skew_mm: 0.75
        max_via_count: 2

  - name: RF_2GHZ
    trace_width_mm: 0.16
    clearance_mm: 0.20
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: rf
    coplanar_waveguide: true
    ground_gap_mm: 0.20
    keepout_clearance_mm: 1.5
    single_nets:
      - RF_ANT_FEED

  - name: I2C_BUS
    trace_width_mm: 0.15
    clearance_mm: 0.15
    via_dia_mm: 0.45
    via_drill_mm: 0.20
    interface_type: digital
    single_nets:
      - I2C_SDA
      - I2C_SCL

  - name: PWR_3V3
    trace_width_mm: 0.35
    clearance_mm: 0.20
    via_dia_mm: 0.50
    via_drill_mm: 0.25
    interface_type: power
    single_nets:
      - 3V3

flex_zones:
  - name: flex_tail_ribbon
    start_x_mm: 30.0
    length_mm: 50.0
    substrate_thickness_mm: 0.050
    coverlay_thickness_mm: 0.025
    min_bend_radius_mm: 3.0
    shape_ref: flex_tail

capacitive_sensors:
  - name: SENSE_WATER_LEVEL_LOW
    channel_id: 0
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX0
    rx_pin: CAP_RX0
    threshold_raw: 2200
    shape_ref: flex_tail

  - name: SENSE_WATER_LEVEL_MID
    channel_id: 1
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX1
    rx_pin: CAP_RX1
    threshold_raw: 2500
    shape_ref: flex_tail

  - name: SENSE_WATER_LEVEL_HIGH
    channel_id: 2
    electrode_type: mutual
    shape: interdigital
    area_mm: [12.0, 10.0]
    pitch_mm: 1.2
    gap_mm: 0.3
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    tx_pin: CAP_TX2
    rx_pin: CAP_RX2
    threshold_raw: 2800
    shape_ref: flex_tail

  - name: SENSE_WATER_PROXIMITY
    channel_id: 3
    electrode_type: self
    shape: pad
    area_mm: [12.0, 8.0]
    drive_shield: true
    hatch_ground_pour: true
    hatch_line_width_mm: 0.15
    hatch_pitch_mm: 0.50
    rx_pin: CAP_RX3
    threshold_raw: 1500
    shape_ref: flex_tail

mounting_holes:
  - name: MH1
    position_mm: [25.5, 40.5]
    drill_diameter_mm: 3.2
    pad_diameter_mm: 4.5
    plated: true
    net: GND

  - name: MH2
    position_mm: [-25.5, 40.5]
    drill_diameter_mm: 3.2
    pad_diameter_mm: 4.5
    plated: true
    net: GND

  - name: MH3
    position_mm: [-25.5, -40.5]
    drill_diameter_mm: 3.2
    pad_diameter_mm: 4.5
    plated: true
    net: GND

  - name: MH4
    position_mm: [25.5, -40.5]
    drill_diameter_mm: 3.2
    pad_diameter_mm: 4.5
    plated: true
    net: GND

schematic_sheets:
  - title: Power & Ground Distribution
    description: 3.3V primary rail, decoupling capacitors, and load switch MOSFET
    components: [U1, Q1, J1, C1, C2, C3]
    pin_breakouts:
      U1: [H7, H8, D1]
      Q1: [G, S, D]
      J1: [GND, 3V3, VLOAD_SW]
      C1: ["1", "2"]
      C2: ["1", "2"]
      C3: ["1", "2"]

  - title: High-Speed I/O & Interfaces
    description: PCIe Gen4 x1 differential link and MIPI D-PHY display interface
    components: [J1, U1, J2]
    pin_breakouts:
      J1: [PETp0, PETn0, PERp0, PERn0]
      U1: [A1, A2, B1, B2, N14, P14, C1, C2]
      J2: [D0_P, D0_N, CLK_P, CLK_N]

  - title: Capacitive Sensing & Control
    description: CY8CMBR3116 CapSense controller, 4-channel liquid level flex tail, and I2C bus
    components: [U1, U2, J2, R1, R2]
    pin_breakouts:
      U1: [F1, F2, D2]
      U2: [VDD, VSS, SDA, SCL, INT, CS0, CS1, CS2, CS3, CS4, CS5, CS6, SHIELD]
      J2: [CAP_TX0, CAP_RX0, CAP_TX1, CAP_RX1, CAP_TX2, CAP_RX2, CAP_RX3, CAP_SHIELD]
      R1: ["1", "2"]
      R2: ["1", "2"]

assembly_test:
  test_fixture: flying_probe
  pass_criteria: all_steps_within_tolerance
  instructions:
    - step_id: TEST_CONTINUITY_GND
      description: Verify solid low-impedance ground plane continuity across all copper layers
      test_type: continuity
      net_or_points: [GND, IN1_GND, IN3_PWR]
      expected_nominal: 0.05
      tolerance_pct: 20.0
      unit: ohm
    - step_id: TEST_IMP_PCIE_DIFF
      description: Measure PCIe Gen4 differential impedance on TX0+/TX0-
      test_type: impedance
      net_or_points: [PCIE_TX0_P, PCIE_TX0_N]
      expected_nominal: 85.0
      tolerance_pct: 10.0
      unit: ohm
      stimulus: 100ps TDR step
    - step_id: TEST_CAP_SENSE_CHAN0
      description: Measure baseline mutual capacitance on liquid level electrode Channel 0
      test_type: capacitance
      net_or_points: [CAP_TX0, CAP_RX0]
      expected_nominal: 12.5
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN1
      description: Measure baseline mutual capacitance on liquid level electrode Channel 1
      test_type: capacitance
      net_or_points: [CAP_TX1, CAP_RX1]
      expected_nominal: 14.0
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN2
      description: Measure baseline mutual capacitance on liquid level electrode Channel 2
      test_type: capacitance
      net_or_points: [CAP_TX2, CAP_RX2]
      expected_nominal: 15.5
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square
    - step_id: TEST_CAP_SENSE_CHAN3
      description: Measure baseline self capacitance on liquid proximity electrode Channel 3
      test_type: capacitance
      net_or_points: [CAP_RX3]
      expected_nominal: 8.0
      tolerance_pct: 15.0
      unit: pF
      stimulus: 250kHz 1.8V square

