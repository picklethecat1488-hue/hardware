<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background plaque gradients -->
    <linearGradient id="scope-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d28"/>
      <stop offset="50%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Metallic Gold Bevel -->
    <linearGradient id="scope-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#c87a00"/>
    </linearGradient>

    <!-- High-voltage Cyan Reticle Glow -->
    <linearGradient id="scope-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70f3ff"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>

    <!-- PCB Soldermask Green -->
    <linearGradient id="scope-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Reticle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plaque -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#scope-bg)" stroke="url(#scope-gold)" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="9" fill="none" stroke="#232b3b" stroke-width="1.2"/>

  <!-- Optical Scope Outer Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#scope-cyan)" stroke-width="1.5" stroke-dasharray="8 3" opacity="0.85"/>
  <circle cx="32" cy="32" r="16" fill="rgba(0, 229, 255, 0.04)" stroke="#38455e" stroke-width="1"/>

  <!-- Cardinal Scope Reticle Ticks -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="url(#scope-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="url(#scope-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="url(#scope-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="58" y2="32" stroke="url(#scope-gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- CAD 3D Isometric Cube (Top-Left quadrant of lens) -->
  <!-- Top Face -->
  <polygon points="26,20 32,16.5 38,20 32,23.5" fill="#38455e" stroke="url(#scope-cyan)" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="26,20 32,23.5 32,31 26,27.5" fill="#181d28" stroke="url(#scope-cyan)" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="38,20 32,23.5 32,31 38,27.5" fill="#232b3b" stroke="url(#scope-cyan)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- PCB Traces & Vias (Bottom-Right quadrant of lens) -->
  <!-- Copper traces -->
  <path d="M 22 41 L 28 41 L 34 47 L 42 47" fill="none" stroke="url(#scope-pcb)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 37 L 38 43 L 44 43" fill="none" stroke="url(#scope-pcb)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold Plated PCB Vias / Pads -->
  <circle cx="22" cy="41" r="2.5" fill="#ffaa00" stroke="#000" stroke-width="0.8"/>
  <circle cx="22" cy="41" r="1" fill="#000"/>
  <circle cx="42" cy="47" r="2.5" fill="#ffaa00" stroke="#000" stroke-width="0.8"/>
  <circle cx="42" cy="47" r="1" fill="#000"/>
  <circle cx="32" cy="37" r="2" fill="#ffaa00" stroke="#000" stroke-width="0.6"/>

  <!-- Center Optical Reticle Focal Target -->
  <circle cx="32" cy="32" r="3" fill="none" stroke="url(#scope-gold)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="1" fill="#00e5ff"/>
  <line x1="32" y1="27" x2="32" y2="30" stroke="#00e5ff" stroke-width="1"/>
  <line x1="32" y1="34" x2="32" y2="37" stroke="#00e5ff" stroke-width="1"/>
  <line x1="27" y1="32" x2="30" y2="32" stroke="#00e5ff" stroke-width="1"/>
  <line x1="34" y1="32" x2="37" y2="32" stroke="#00e5ff" stroke-width="1"/>
</svg>
